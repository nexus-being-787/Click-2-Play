<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hello Kitty: Springtime Adventure</title>
  <style>
    :root {
      --bg: #1a0a20;
      --pink: #ff69b4;
      --hotpink: #ff1493;
      --gold: #ffd700;
      --white: #ffffff;
      --spring-green: #98fb98;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      color: white;
    }
    #gameCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--pink);
      font-size: 14px;
    }
    .status-alert { 
      color: var(--hotpink); 
      text-shadow: 0 0 12px var(--hotpink); 
      opacity: 0; 
      transition: opacity 0.15s; 
    }
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(255, 182, 193, 0.15) 0%, rgba(26, 10, 32, 0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      pointer-events: auto;
      text-align: center;
      padding: 20px;
    }
    .hidden { display: none !important; }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      color: var(--pink);
      text-shadow: 0 0 30px var(--pink), 3px 3px 0px var(--hotpink), 6px 6px 0px rgba(255, 215, 0, 0.5);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 8px;
      animation: crazyBounce 1.5s infinite;
    }
    @keyframes crazyBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      25% { transform: translateY(-15px) rotate(2deg) scale(1.05); }
      50% { transform: translateY(-5px) rotate(-1deg) scale(0.95); }
      75% { transform: translateY(-20px) rotate(3deg) scale(1.08); }
    }
    p { 
      color: #ffb6c1; 
      margin-bottom: 30px; 
      letter-spacing: 2px; 
      max-width: 520px; 
      line-height: 1.8;
      font-size: 1.1rem;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
    }
    .btn {
      padding: 18px 48px;
      background: transparent;
      color: var(--pink);
      border: 3px solid var(--pink);
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 4px;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.4), inset 0 0 20px rgba(255, 105, 180, 0.2);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 50px;
      animation: buttonPulse 2s infinite;
    }
    @keyframes buttonPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 105, 180, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(255, 105, 180, 0.8); }
    }
    .btn:hover { background: var(--pink); color: #1a0a10; transform: scale(1.15); }
    .btn:active { transform: scale(0.9); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-layer">
    <div class="hud-top">
      <div id="floor-display">🌸 Spring Sector 01</div>
      <div id="targets-display" style="color:var(--gold); text-shadow: 0 0 8px var(--gold); font-size: 16px;">😊 Grumpy Friends: 3</div>
      <div id="alert-display" class="status-alert">KITTY SPOTTED!</div>
    </div>
  </div>

  <div id="start-screen" class="screen">
    <h1>HELLO KITTY</h1>
    <p>🌈✨ Bounce through the magical spring gardens! 🌸<br>Give grumpy friends warm hugs to spread happiness! 💖</p>
    <button class="btn" id="btn-start">🌟 Start Adventure 🌟</button>
  </div>

  <div id="game-over-screen" class="screen hidden">
    <h1 style="color: var(--hotpink); text-shadow: 0 0 30px var(--hotpink), 3px 3px 0px #ff0000;">Oh No! 💔</h1>
    <p id="death-reason">The grumpy friends caught Hello Kitty!</p>
    <button class="btn" style="border-color: var(--hotpink); color: var(--hotpink);" id="btn-restart">🌈 Bounce Back!</button>
  </div>

  <div id="victory-screen" class="screen hidden">
    <h1 style="color: var(--spring-green); text-shadow: 0 0 30px var(--spring-green), 3px 3px 0px #32cd32;">Friendship Wins! 🎉</h1>
    <p>All grumpy friends became happy! Spring has arrived! 🌸🦋</p>
    <button class="btn" id="btn-next">🌟 Next Garden 🌟</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
  class SoundFX {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    boing() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);
      osc.frequency.exponentialRampToValueAtTime(400, t + 0.3);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.35);
    }
    hug() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [880, 1108.73, 1318.51].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t + i * 0.05);
        gain.gain.setValueAtTime(0.2, t + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.3);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t + i * 0.05);
        osc.stop(t + i * 0.05 + 0.3);
      });
    }
    alarm() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.setValueAtTime(900, t + 0.15);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.3);
    }
    portal() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(523, t);
      osc.frequency.exponentialRampToValueAtTime(1047, t + 0.5);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.5);
    }
  }

  const sfx = new SoundFX();

  const GAME = {
    state: 'MENU',
    level: 1,
    timeScale: 1.0,
    keys: { w: false, a: false, s: false, d: false }
  };

  class CameraRig {
    constructor(camera) {
      this.camera = camera;
      this.offset = new THREE.Vector3(12, 19, 12);
      this.currentPos = new THREE.Vector3();
      this.trauma = 0;
      this.springOffset = 0;
    }
    addTrauma(amount) {
      this.trauma = Math.min(this.trauma + amount, 1.0);
    }
    update(delta, targetPos) {
      this.springOffset = Math.sin(performance.now() * 0.003) * 0.3;
      
      const desired = targetPos.clone().add(this.offset);
      desired.y += this.springOffset;
      this.currentPos.lerp(desired, 6.0 * delta);

      let sX = 0, sY = 0, sZ = 0, rZ = 0;
      if (this.trauma > 0) {
        const p = this.trauma * this.trauma;
        sX = (Math.random() - 0.5) * 2.8 * p;
        sY = (Math.random() - 0.5) * 2.8 * p;
        sZ = (Math.random() - 0.5) * 2.8 * p;
        rZ = (Math.random() - 0.5) * 0.09 * p;
        this.trauma = Math.max(0, this.trauma - delta * 1.8);
      }

      this.camera.position.set(this.currentPos.x + sX, this.currentPos.y + sY, this.currentPos.z + sZ);
      this.camera.lookAt(targetPos);
      this.camera.rotateZ(rZ);
    }
  }

  /* =========================================================================
     HELLO KITTY - SLIM AND PROPERLY PROPORTIONED
     ========================================================================= */
  class HelloKitty {
    constructor(scene) {
      this.scene = scene;
      this.radius = 0.55;
      this.speed = 13.5;
      this.mesh = new THREE.Group();
      this.walkCycle = 0;
      this.bouncePhase = 0;
      this.isBoinging = false;

      const whiteFur = new THREE.MeshStandardMaterial({ 
        color: 0xffffff, 
        roughness: 0.6, 
        metalness: 0.1 
      });
      const pinkMat = new THREE.MeshStandardMaterial({ 
        color: 0xff69b4, 
        roughness: 0.5, 
        metalness: 0.3 
      });
      const redBowMat = new THREE.MeshStandardMaterial({ 
        color: 0xff0000, 
        roughness: 0.4, 
        metalness: 0.2 
      });
      const yellowMat = new THREE.MeshStandardMaterial({ 
        color: 0xffd700, 
        roughness: 0.3, 
        metalness: 0.5,
        emissive: 0xffaa00,
        emissiveIntensity: 0.3
      });

      // SLIM BODY (Smaller and more proportional)
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), whiteFur);
      body.position.y = 0.55;
      body.scale.set(0.8, 0.7, 0.5);
      body.castShadow = true;
      this.body = body;
      this.mesh.add(body);

      // HEAD (Big round head, signature but proportional)
      const head = new THREE.Group();
      head.position.set(0, 1.0, 0);
      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), whiteFur);
      skull.castShadow = true;
      head.add(skull);
      this.head = head;
      this.mesh.add(head);

      // EARS (Smaller pointy ears)
      const earGeo = new THREE.ConeGeometry(0.12, 0.22, 4);
      const leftEar = new THREE.Mesh(earGeo, whiteFur);
      leftEar.position.set(-0.26, 0.26, 0);
      leftEar.rotation.z = 0.15;
      const rightEar = leftEar.clone();
      rightEar.position.x = 0.26;
      rightEar.rotation.z = -0.15;
      head.add(leftEar, rightEar);

      // Inner ear pink
      const innerEarGeo = new THREE.ConeGeometry(0.06, 0.14, 4);
      const leftInnerEar = new THREE.Mesh(innerEarGeo, pinkMat);
      leftInnerEar.position.set(-0.26, 0.28, 0);
      leftInnerEar.rotation.z = 0.15;
      const rightInnerEar = leftInnerEar.clone();
      rightInnerEar.position.x = 0.26;
      rightInnerEar.rotation.z = -0.15;
      head.add(leftInnerEar, rightInnerEar);

      // EYES
      const eyeGeo = new THREE.SphereGeometry(0.06, 16, 16);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.14, 0.04, 0.34);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.14;
      head.add(leftEye, rightEye);

      // NOSE (Smaller yellow oval)
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), yellowMat);
      nose.position.set(0, -0.04, 0.36);
      nose.scale.set(1, 0.7, 0.4);
      head.add(nose);

      // WHISKERS
      const whiskerMat = new THREE.LineBasicMaterial({ color: 0x000000 });
      for (let side = -1; side <= 1; side += 2) {
        for (let i = -1; i <= 1; i++) {
          const points = [];
          points.push(new THREE.Vector3(side * 0.18, -0.04 + i * 0.08, 0.38));
          points.push(new THREE.Vector3(side * 0.42, -0.04 + i * 0.14, 0.38));
          const whiskerGeo = new THREE.BufferGeometry().setFromPoints(points);
          const whisker = new THREE.Line(whiskerGeo, whiskerMat);
          head.add(whisker);
        }
      }

      // RED BOW (Smaller, on left ear)
      const bowGeo = new THREE.SphereGeometry(0.1, 16, 16);
      const bowLeft = new THREE.Mesh(bowGeo, redBowMat);
      bowLeft.position.set(-0.32, 0.3, 0);
      bowLeft.scale.set(1.5, 0.8, 0.4);
      const bowRight = bowLeft.clone();
      bowRight.position.x = -0.2;
      bowRight.position.y = 0.26;
      const bowCenter = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), redBowMat);
      bowCenter.position.set(-0.26, 0.28, 0.08);
      head.add(bowLeft, bowRight, bowCenter);

      // ARMS (Slimmer arms)
      this.arms = [];
      const armGeo = new THREE.SphereGeometry(0.1, 16, 16);
      const leftArm = new THREE.Mesh(armGeo, whiteFur);
      leftArm.position.set(-0.45, 0.55, 0);
      leftArm.scale.set(0.6, 1.0, 0.6);
      const rightArm = leftArm.clone();
      rightArm.position.x = 0.45;
      this.mesh.add(leftArm, rightArm);
      this.arms.push(leftArm, rightArm);

      // LEGS (Slimmer legs)
      this.legs = [];
      const legGeo = new THREE.SphereGeometry(0.12, 16, 16);
      const leftLeg = new THREE.Mesh(legGeo, whiteFur);
      leftLeg.position.set(-0.18, 0.12, 0);
      leftLeg.scale.set(0.7, 1.1, 0.7);
      leftLeg.castShadow = true;
      const rightLeg = leftLeg.clone();
      rightLeg.position.x = 0.18;
      this.mesh.add(leftLeg, rightLeg);
      this.legs.push(leftLeg, rightLeg);

      // SLIM PINK DRESS
      const dress = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.4, 0.3, 16),
        pinkMat
      );
      dress.position.y = 0.35;
      dress.castShadow = true;
      this.mesh.add(dress);
      this.dress = dress;

      // Sparkle light
      this.light = new THREE.PointLight(0xff69b4, 2.5, 7);
      this.light.position.y = 0.9;
      this.mesh.add(this.light);

      this.scene.add(this.mesh);
    }

    update(delta, inputVec, walls) {
      if (GAME.state !== 'PLAYING') return;

      const isMoving = inputVec.lengthSq() > 0.01;

      if (isMoving) {
        inputVec.normalize();
        const moveStep = inputVec.clone().multiplyScalar(this.speed * delta);

        const nextX = this.mesh.position.x + moveStep.x;
        if (!this.checkWallCollision(nextX, this.mesh.position.z, walls)) {
          this.mesh.position.x = nextX;
        }
        const nextZ = this.mesh.position.z + moveStep.z;
        if (!this.checkWallCollision(this.mesh.position.x, nextZ, walls)) {
          this.mesh.position.z = nextZ;
        }

        const targetAngle = Math.atan2(inputVec.x, inputVec.z);
        let diff = targetAngle - this.mesh.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.mesh.rotation.y += diff * 18 * delta;

        // Graceful waddle animation
        this.walkCycle += delta * 14;
        
        this.legs[0].position.x = -0.18 + Math.sin(this.walkCycle) * 0.1;
        this.legs[1].position.x = 0.18 - Math.sin(this.walkCycle) * 0.1;
        this.legs[0].position.y = 0.12 + Math.abs(Math.sin(this.walkCycle)) * 0.08;
        this.legs[1].position.y = 0.12 + Math.abs(Math.cos(this.walkCycle)) * 0.08;

        this.arms[0].position.x = -0.45 + Math.sin(this.walkCycle) * 0.08;
        this.arms[1].position.x = 0.45 - Math.sin(this.walkCycle) * 0.08;

        this.body.position.y = 0.55 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;
        this.head.position.y = 1.0 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;
        this.dress.position.y = 0.35 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;

        this.mesh.scale.y = 1 - Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;
        this.mesh.scale.x = 1 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.02;
        this.mesh.scale.z = 1 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.02;
      } else {
        this.legs.forEach(l => l.position.x += (l === this.legs[0] ? -0.18 : 0.18 - l.position.x) * 12 * delta);
        this.legs.forEach(l => l.position.y += (0.12 - l.position.y) * 12 * delta);
        this.body.position.y += (0.55 - this.body.position.y) * 12 * delta;
        this.head.position.y += (1.0 - this.head.position.y) * 12 * delta;
        this.dress.position.y += (0.35 - this.dress.position.y) * 12 * delta;
        
        const idleBounce = Math.sin(performance.now() * 0.003) * 0.02;
        this.mesh.scale.y = 1 + idleBounce;
        this.mesh.scale.x = 1 - idleBounce * 0.3;
        this.mesh.scale.z = 1 - idleBounce * 0.3;
      }

      if (Math.random() < 0.001 && !this.isBoinging) {
        this.isBoinging = true;
        this.bouncePhase = 0;
        sfx.boing();
      }

      if (this.isBoinging) {
        this.bouncePhase += delta * 10;
        if (this.bouncePhase > Math.PI) {
          this.isBoinging = false;
          this.mesh.position.y = 0;
        } else {
          this.mesh.position.y = Math.abs(Math.sin(this.bouncePhase)) * 2;
        }
      }
    }

    checkWallCollision(x, z, walls) {
      for (const w of walls) {
        const nearestX = Math.max(w.min.x, Math.min(x, w.max.x));
        const nearestZ = Math.max(w.min.z, Math.min(z, w.max.z));
        const dx = x - nearestX;
        const dz = z - nearestZ;
        if ((dx * dx + dz * dz) < (this.radius * this.radius)) return true;
      }
      return false;
    }
  }

  /* =========================================================================
     TREE SYSTEM WITH FALLING LEAVES
     ========================================================================= */
  class TreeSystem {
    constructor(scene) {
      this.scene = scene;
      this.leaves = [];
      this.trees = [];
      this.initTrees();
      this.initFallingLeaves();
    }

    initTrees() {
      const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 8);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7 });
      const foliageGeo = new THREE.ConeGeometry(1.2, 2.5, 8);
      const foliageMat = new THREE.MeshStandardMaterial({ color: 0x228b22, roughness: 0.4 });

      // Trees outside the play area
      const treePositions = [
        [-38, -35], [-35, 35], [35, -35], [38, 35],
        [-42, 0], [42, 0], [0, -42], [0, 42],
        [-40, -20], [40, -20], [-40, 20], [40, 20],
        [-35, -40], [35, -40], [-35, 40], [35, 40]
      ];

      treePositions.forEach(([x, z]) => {
        const treeGroup = new THREE.Group();
        
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 1.5;
        trunk.castShadow = true;
        treeGroup.add(trunk);
        
        const foliage1 = new THREE.Mesh(foliageGeo, foliageMat);
        foliage1.position.y = 3.5;
        foliage1.scale.set(1, 1, 1);
        foliage1.castShadow = true;
        treeGroup.add(foliage1);
        
        const foliage2 = new THREE.Mesh(foliageGeo, foliageMat);
        foliage2.position.y = 4.5;
        foliage2.scale.set(0.8, 0.8, 0.8);
        foliage2.castShadow = true;
        treeGroup.add(foliage2);
        
        treeGroup.position.set(x, 0, z);
        treeGroup.userData = {
          foliageY: foliage1.position.y
        };
        
        this.scene.add(treeGroup);
        this.trees.push(treeGroup);
      });
    }

    initFallingLeaves() {
      const leafGeo = new THREE.PlaneGeometry(0.2, 0.2);
      const leafMat = new THREE.MeshStandardMaterial({ 
        color: 0x90ee90, 
        side: THREE.DoubleSide,
        roughness: 0.5 
      });
      
      for (let i = 0; i < 40; i++) {
        const leaf = new THREE.Mesh(leafGeo, leafMat);
        leaf.position.set(
          (Math.random() - 0.5) * 80,
          Math.random() * 30,
          (Math.random() - 0.5) * 80
        );
        leaf.rotation.x = Math.random() * Math.PI;
        leaf.rotation.y = Math.random() * Math.PI;
        leaf.userData = {
          vx: (Math.random() - 0.5) * 2,
          vy: -(Math.random() * 2 + 1),
          vz: (Math.random() - 0.5) * 2,
          rotSpeed: Math.random() * 2 + 0.5,
          life: 1.0
        };
        this.scene.add(leaf);
        this.leaves.push(leaf);
      }
    }

    update(delta, playerZ) {
      // Tree foliage sway
      this.trees.forEach((tree, index) => {
        const sway = Math.sin(performance.now() * 0.001 + index) * 0.1;
        tree.rotation.z = sway;
        tree.rotation.x = Math.cos(performance.now() * 0.0008 + index) * 0.05;
      });

      // Update falling leaves
      this.leaves.forEach((leaf) => {
        leaf.position.x += leaf.userData.vx * delta;
        leaf.position.y += leaf.userData.vy * delta;
        leaf.position.z += leaf.userData.vz * delta;
        
        // Rotate leaves as they fall
        leaf.rotation.x += leaf.userData.rotSpeed * delta;
        leaf.rotation.y += leaf.userData.rotSpeed * delta * 0.7;
        
        // Reset leaves that fall too far
        if (leaf.position.y < 0 || leaf.position.z > playerZ + 40) {
          leaf.position.set(
            (Math.random() - 0.5) * 80,
            Math.random() * 20 + 10,
            playerZ - Math.random() * 40
          );
          leaf.userData.vy = -(Math.random() * 2 + 0.5);
        }
      });
    }
  }

  /* =========================================================================
     GRUMPY FRIEND (GUARD) AI
     ========================================================================= */
  class GrumpyFriend {
    constructor(scene, x, z, waypoints) {
      this.scene = scene;
      this.speed = 3.8;
      this.waypoints = waypoints;
      this.curWaypoint = 0;
      this.isBefriended = false;
      this.springPhase = Math.random() * Math.PI * 2;

      this.mesh = new THREE.Group();
      this.mesh.position.set(x, 0, z);

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x8b6b6b, roughness: 0.4 })
      );
      body.position.y = 0.75;
      body.scale.set(1, 1.2, 0.9);
      body.castShadow = true;
      this.mesh.add(body);
      this.body = body;

      const face = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xff9999 })
      );
      face.position.set(0, 1.1, 0.4);
      this.mesh.add(face);

      const browMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const browGeo = new THREE.BoxGeometry(0.15, 0.03, 0.04);
      const leftBrow = new THREE.Mesh(browGeo, browMat);
      leftBrow.position.set(-0.08, 1.25, 0.5);
      leftBrow.rotation.z = 0.4;
      const rightBrow = leftBrow.clone();
      rightBrow.position.x = 0.08;
      rightBrow.rotation.z = -0.4;
      this.mesh.add(leftBrow, rightBrow);

      this.guardLight = new THREE.PointLight(0xff8888, 1.5, 6);
      this.guardLight.position.y = 1.5;
      this.mesh.add(this.guardLight);

      this.maxDist = 9.0;
      this.fov = Math.PI / 3;
      this.rayCount = 36;

      this.coneGeo = new THREE.BufferGeometry();
      this.coneMat = new THREE.MeshBasicMaterial({
        color: 0xff8888,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      this.fovMesh = new THREE.Mesh(this.coneGeo, this.coneMat);
      this.fovMesh.position.y = 0.25;
      this.scene.add(this.fovMesh);

      this.visionSweep = 0;
      this.scene.add(this.mesh);

      this.raycaster = new THREE.Raycaster();
    }

    update(delta, player, wallMeshes) {
      if (this.isBefriended || GAME.state !== 'PLAYING') return;

      this.springPhase += delta * 3;
      this.body.position.y = 0.75 + Math.abs(Math.sin(this.springPhase)) * 0.25;
      this.mesh.scale.y = 1 - Math.abs(Math.sin(this.springPhase)) * 0.08;

      if (this.waypoints.length > 0) {
        const target = this.waypoints[this.curWaypoint];
        const dir = new THREE.Vector3().subVectors(target, this.mesh.position);
        dir.y = 0;
        if (dir.length() < 0.4) {
          this.curWaypoint = (this.curWaypoint + 1) % this.waypoints.length;
        } else {
          dir.normalize();
          this.mesh.position.addScaledVector(dir, this.speed * delta);
          const targetAngle = Math.atan2(dir.x, dir.z);
          let diff = targetAngle - this.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          this.mesh.rotation.y += diff * 6 * delta;
        }
      }

      this.visionSweep = Math.sin(performance.now() * 0.0024) * 0.65;
      this.renderDynamicFOV(wallMeshes, player);
    }

    renderDynamicFOV(wallMeshes, player) {
      const baseAngle = this.mesh.rotation.y + this.visionSweep;
      const startAngle = baseAngle - (this.fov / 2);
      const angleStep = this.fov / (this.rayCount - 1);

      const centerOrigin = this.mesh.position.clone().add(new THREE.Vector3(0, 0.4, 0));
      const vertices = [];
      const originX = centerOrigin.x;
      const originZ = centerOrigin.z;

      for (let i = 0; i < this.rayCount; i++) {
        const currentAngle = startAngle + (i * angleStep);
        const dir = new THREE.Vector3(Math.sin(currentAngle), 0, Math.cos(currentAngle)).normalize();

        this.raycaster.set(centerOrigin, dir);
        this.raycaster.near = 0.2;
        this.raycaster.far = this.maxDist;

        const hits = this.raycaster.intersectObjects(wallMeshes, false);
        const castDist = hits.length > 0 ? hits[0].distance : this.maxDist;

        vertices.push(originX + dir.x * castDist, 0.25, originZ + dir.z * castDist);
      }

      const positions = [];
      for (let i = 0; i < this.rayCount - 1; i++) {
        positions.push(originX, 0.25, originZ);
        positions.push(vertices[i * 3], vertices[i * 3 + 1], vertices[i * 3 + 2]);
        positions.push(vertices[(i + 1) * 3], vertices[(i + 1) * 3 + 1], vertices[(i + 1) * 3 + 2]);
      }

      this.coneGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      this.coneGeo.computeVertexNormals();

      const toKitty = new THREE.Vector3().subVectors(player.mesh.position, this.mesh.position);
      toKitty.y = 0;
      const distToKitty = toKitty.length();

      if (distToKitty < this.maxDist + player.radius) {
        toKitty.normalize();
        const fwd = new THREE.Vector3(Math.sin(baseAngle), 0, Math.cos(baseAngle));
        const angle = Math.acos(Math.min(1, Math.max(-1, fwd.dot(toKitty))));

        if (angle < this.fov / 2) {
          const rayOrigin = this.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0));
          const rayDir = player.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0)).sub(rayOrigin).normalize();
          this.raycaster.set(rayOrigin, rayDir);
          this.raycaster.far = distToKitty;

          const occlusions = this.raycaster.intersectObjects(wallMeshes, false);
          if (occlusions.length === 0) {
            triggerGameOver("The grumpy friends spotted Hello Kitty!");
          }
        }
      }
    }

    befriend() {
      this.isBefriended = true;
      this.body.material.color.setHex(0x90ee90);
      this.scene.remove(this.mesh);
      this.scene.remove(this.fovMesh);
    }
  }

  /* =========================================================================
     SPARKLE FIELDS & EFFECTS
     ========================================================================= */
  class SparkleField {
    constructor(scene, p1, p2, moveAxis = null, range = 0) {
      this.scene = scene;
      this.p1 = p1;
      this.p2 = p2;
      this.moveAxis = moveAxis;
      this.range = range;
      this.baseP1 = p1.clone();
      this.baseP2 = p2.clone();

      const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
      const mat = new THREE.LineBasicMaterial({ color: 0xff69b4, linewidth: 3 });
      this.line = new THREE.Line(geo, mat);

      const glowMat = new THREE.LineBasicMaterial({ color: 0xffb6c1, transparent: true, opacity: 0.6 });
      this.glow = new THREE.Line(geo, glowMat);
      this.glow.scale.set(1.02, 1.5, 1.02);

      this.group = new THREE.Group();
      this.group.add(this.line);
      this.group.add(this.glow);
      this.scene.add(this.group);
    }

    update(delta, playerPos) {
      const springOffset = Math.sin(performance.now() * 0.003) * this.range;
      if (this.moveAxis === 'x') {
        this.p1.x = this.baseP1.x + springOffset;
        this.p2.x = this.baseP2.x + springOffset;
      } else if (this.moveAxis === 'z') {
        this.p1.z = this.baseP1.z + springOffset;
        this.p2.z = this.baseP2.z + springOffset;
      }
      this.line.geometry.setFromPoints([this.p1, this.p2]);
      this.glow.geometry.setFromPoints([this.p1, this.p2]);

      const dist = this.distToSegment(playerPos, this.p1, this.p2);
      if (dist < 0.65) {
        triggerGameOver("Hello Kitty touched the springy barrier!");
      }
    }

    distToSegment(p, a, b) {
      const l2 = (b.x - a.x) ** 2 + (b.z - a.z) ** 2;
      if (l2 === 0) return Math.hypot(p.x - a.x, p.z - a.z);
      let t = ((p.x - a.x) * (b.x - a.x) + (p.z - a.z) * (b.z - a.z)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.z - (a.z + t * (b.z - a.z)));
    }

    destroy() { this.scene.remove(this.group); }
  }

  class FXEngine {
    constructor(scene) {
      this.scene = scene;
      this.particles = [];
      this.heartGeo = new THREE.SphereGeometry(0.15, 8, 8);
      this.mat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
      this.springFlowers = [];
      this.initSpringFlowers();
    }

    initSpringFlowers() {
      const flowerGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const flowerMat = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
      
      for (let i = 0; i < 15; i++) {
        const flower = new THREE.Mesh(flowerGeo, flowerMat);
        flower.position.set(
          (Math.random() - 0.5) * 80,
          0.1,
          (Math.random() - 0.5) * 80
        );
        flower.scale.set(0.4, 0.15, 0.4);
        flower.userData = {
          phase: Math.random() * Math.PI * 2,
          baseY: 0.1
        };
        this.scene.add(flower);
        this.springFlowers.push(flower);
      }
    }

    friendshipBurst(pos) {
      for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(this.heartGeo, this.mat);
        p.position.copy(pos);
        p.position.y += 0.8;
        p.userData = {
          vx: (Math.random() - 0.5) * 15,
          vy: Math.random() * 10 + 3,
          vz: (Math.random() - 0.5) * 15,
          life: 1.0
        };
        this.scene.add(p);
        this.particles.push(p);
      }
    }

    hugRibbon(start, end) {
      const geom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(start.x, 0.5, start.z),
        new THREE.Vector3(end.x, 0.5, end.z)
      ]);
      const mat = new THREE.LineBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 1 });
      const line = new THREE.Line(geom, mat);
      this.scene.add(line);
      const startTime = performance.now();

      const fade = () => {
        const elapsed = (performance.now() - startTime) / 1000;
        if (elapsed < 0.2) {
          line.material.opacity = 1 - (elapsed / 0.2);
          requestAnimationFrame(fade);
        } else {
          this.scene.remove(line);
        }
      };
      fade();
    }

    update(delta) {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.userData.life -= delta * 1.8;
        if (p.userData.life <= 0) {
          this.scene.remove(p);
          this.particles.splice(i, 1);
          continue;
        }
        p.userData.vy -= 30 * delta;
        p.position.x += p.userData.vx * delta;
        p.position.y += p.userData.vy * delta;
        p.position.z += p.userData.vz * delta;
        p.scale.setScalar(p.userData.life);
      }

      this.springFlowers.forEach(flower => {
        flower.userData.phase += delta * 2;
        flower.position.y = flower.userData.baseY + Math.abs(Math.sin(flower.userData.phase)) * 0.25;
        flower.scale.setScalar(0.4 + Math.abs(Math.sin(flower.userData.phase)) * 0.2);
      });
    }
  }

  class LevelWorld {
    constructor(scene) {
      this.scene = scene;
      this.wallMeshes = [];
      this.wallBoxes = [];
      this.initStaticEnvironment();
    }

    initStaticEnvironment() {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(120, 120),
        new THREE.MeshStandardMaterial({ 
          color: 0x1a3520, 
          roughness: 0.5, 
          metalness: 0.1 
        })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      this.scene.add(floor);

      const grid = new THREE.GridHelper(120, 60, 0x98fb98, 0x3d5a3d);
      grid.position.y = 0.02;
      grid.material.opacity = 0.4;
      grid.material.transparent = true;
      this.scene.add(grid);
    }

    addWall(x, z, w, d) {
      const h = 3.5;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ 
          color: 0x2a3520, 
          roughness: 0.6, 
          metalness: 0.3 
        })
      );
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const wf = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry),
        new THREE.LineBasicMaterial({ color: 0x98fb98, transparent: true, opacity: 0.6 })
      );
      mesh.add(wf);

      this.scene.add(mesh);
      this.wallMeshes.push(mesh);
      this.wallBoxes.push(new THREE.Box2(
        new THREE.Vector2(x - w / 2, z - d / 2),
        new THREE.Vector2(x + w / 2, z + d / 2)
      ));
    }

    buildFacility() {
      this.addWall(0, -26, 50, 2);
      this.addWall(0, 26, 50, 2);
      this.addWall(-26, 0, 2, 50);
      this.addWall(26, 0, 2, 50);

      this.addWall(-10, -10, 14, 2);
      this.addWall(10, -8, 2, 18);
      this.addWall(-8, 10, 2, 16);
      this.addWall(10, 12, 14, 2);
      this.addWall(0, 0, 5, 5);
    }
  }

  /* =========================================================================
     CORE ORCHESTRATION LOOP
     ========================================================================= */
  let scene, camera, renderer, rig, kitty, fx, world, trees;
  let grumpyFriends = [], sparkles = [];
  let exitPortal = null;
  let lastTime = 0;

  function init() {
    const canvas = document.getElementById('gameCanvas');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0a20);
    scene.fog = new THREE.Fog(0x1a0a20, 25, 90);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    rig = new CameraRig(camera);

    const amb = new THREE.AmbientLight(0x556655, 1.4);
    scene.add(amb);

    const dir = new THREE.DirectionalLight(0xd0ffd0, 1.6);
    dir.position.set(-20, 35, 20);
    dir.castShadow = true;
    dir.shadow.mapSize.width = 1024;
    dir.shadow.mapSize.height = 1024;
    scene.add(dir);

    world = new LevelWorld(scene);
    world.buildFacility();

    kitty = new HelloKitty(scene);
    fx = new FXEngine(scene);
    trees = new TreeSystem(scene);

    const portalGeo = new THREE.CylinderGeometry(1.8, 2.0, 0.2, 32);
    const portalMat = new THREE.MeshStandardMaterial({ color: 0x3d5a3d, roughness: 0.3 });
    exitPortal = new THREE.Mesh(portalGeo, portalMat);
    exitPortal.position.set(22, 0.1, 22);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.4, 1.8, 32),
      new THREE.MeshBasicMaterial({ color: 0x98fb98, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.12;
    exitPortal.add(ring);
    scene.add(exitPortal);

    setupLevelData();
    setupInputs();

    requestAnimationFrame(renderLoop);
  }

  function setupLevelData() {
    grumpyFriends.forEach(g => g.befriend());
    grumpyFriends = [];
    sparkles.forEach(l => l.destroy());
    sparkles = [];

    kitty.mesh.position.set(-22, 0, -22);

    grumpyFriends.push(new GrumpyFriend(scene, -12, 0, [
      new THREE.Vector3(-12, 0, -8),
      new THREE.Vector3(-12, 0, 8)
    ]));
    grumpyFriends.push(new GrumpyFriend(scene, 5, -18, [
      new THREE.Vector3(-4, 0, -18),
      new THREE.Vector3(8, 0, -18)
    ]));
    grumpyFriends.push(new GrumpyFriend(scene, 18, 5, [
      new THREE.Vector3(18, 0, -2),
      new THREE.Vector3(18, 0, 18)
    ]));

    sparkles.push(new SparkleField(scene, new THREE.Vector3(-6, 0.5, -2), new THREE.Vector3(6, 0.5, -2), 'z', 6));
    sparkles.push(new SparkleField(scene, new THREE.Vector3(0, 0.5, 6), new THREE.Vector3(0, 0.5, 20), 'x', 5));

    updateHUD();
  }

  function updateHUD() {
    document.getElementById('targets-display').innerText = `😊 Grumpy Friends: ${grumpyFriends.filter(g => !g.isBefriended).length}`;
    document.getElementById('floor-display').innerText = `🌸 Spring Sector 0${GAME.level}`;
  }

  function triggerGameOver(reason) {
    if (GAME.state !== 'PLAYING') return;
    GAME.state = 'KILLED';
    sfx.alarm();
    document.getElementById('alert-display').style.opacity = 1;
    document.getElementById('death-reason').innerText = reason;
    setTimeout(() => {
      document.getElementById('game-over-screen').classList.remove('hidden');
    }, 600);
  }

  function checkFriendship() {
    const hugDist = 2.8;
    for (let i = grumpyFriends.length - 1; i >= 0; i--) {
      const m = grumpyFriends[i];
      if (m.isBefriended) continue;

      if (kitty.mesh.position.distanceTo(m.mesh.position) < hugDist) {
        const startPos = kitty.mesh.position.clone();
        kitty.mesh.position.copy(m.mesh.position);

        fx.hugRibbon(startPos, kitty.mesh.position);
        fx.friendshipBurst(kitty.mesh.position);

        m.befriend();
        sfx.hug();

        GAME.timeScale = 0.04;
        rig.addTrauma(1.0);
        updateHUD();
      }
    }

    const remaining = grumpyFriends.filter(g => !g.isBefriended).length;
    if (remaining === 0) {
      exitPortal.children[0].material.color.setHex(0x98fb98);
      if (kitty.mesh.position.distanceTo(exitPortal.position) < 2.0) {
        sfx.portal();
        GAME.state = 'CLEAR';
        document.getElementById('victory-screen').classList.remove('hidden');
      }
    }
  }

  function renderLoop(now) {
    requestAnimationFrame(renderLoop);
    let rawDelta = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    GAME.timeScale += (1.0 - GAME.timeScale) * 5.0 * rawDelta;
    const delta = rawDelta * GAME.timeScale;

    if (GAME.state === 'PLAYING') {
      let moveDir = Input.getVector();
      kitty.update(delta, moveDir, world.wallBoxes);

      grumpyFriends.forEach(g => g.update(delta, kitty, world.wallMeshes));
      sparkles.forEach(l => l.update(delta, kitty.mesh.position));
      checkFriendship();
    }

    fx.update(rawDelta);
    trees.update(rawDelta, kitty.mesh.position.z);
    rig.update(rawDelta, kitty.mesh.position);
    renderer.render(scene, camera);
  }

  const Input = {
    getVector() {
      const v = new THREE.Vector3();
      if (GAME.keys.w) v.z -= 1;
      if (GAME.keys.s) v.z += 1;
      if (GAME.keys.a) v.x -= 1;
      if (GAME.keys.d) v.x += 1;
      if (v.lengthSq() > 0) {
        v.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 4);
      }
      return v;
    }
  };

  function setupInputs() {
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (GAME.keys.hasOwnProperty(k)) GAME.keys[k] = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (GAME.keys.hasOwnProperty(k)) GAME.keys[k] = false;
    });

    document.getElementById('btn-start').onclick = () => {
      sfx.init();
      document.getElementById('start-screen').classList.add('hidden');
      GAME.state = 'PLAYING';
      lastTime = performance.now();
    };

    document.getElementById('btn-restart').onclick = () => {
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('alert-display').style.opacity = 0;
      setupLevelData();
      GAME.state = 'PLAYING';
    };

    document.getElementById('btn-next').onclick = () => {
      document.getElementById('victory-screen').classList.add('hidden');
      GAME.level++;
      setupLevelData();
      GAME.state = 'PLAYING';
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  window.onload = init;
  </script>
