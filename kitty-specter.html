<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hello Kitty: Dark Spring Adventure</title>
  <style>
    :root {
      --bg: #1a0a20;
      --pink: #ff69b4;
      --hotpink: #ff1493;
      --gold: #ffd700;
      --white: #ffffff;
      --spring-green: #98fb98;
      --cherry-pink: #ffb7c5;
      --blood-red: #8b0000;
      --dark-red: #4a0000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      color: white;
    }
    #gameCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }
    #leafOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .falling-leaf {
      position: absolute;
      width: 15px;
      height: 15px;
      background: #ffb7c5;
      border-radius: 0 50% 0 50%;
      opacity: 0.7;
      animation: leafFall linear infinite;
    }
    @keyframes leafFall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 0.7; }
      50% { opacity: 0.5; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--pink);
      font-size: 13px;
    }
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .powerup-display {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 182, 193, 0.5);
      border-radius: 20px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
    }
    .powerup-icon { font-size: 24px; margin-right: 8px; }
    .stars-display {
      color: var(--gold);
      font-size: 24px;
      text-shadow: 0 0 10px var(--gold);
    }
    .status-alert { 
      color: var(--hotpink); 
      text-shadow: 0 0 12px var(--hotpink); 
      opacity: 0; 
      transition: opacity 0.15s; 
    }
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(255, 182, 193, 0.2) 0%, rgba(26, 10, 32, 0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      pointer-events: auto;
      text-align: center;
      padding: 20px;
    }
    .hidden { display: none !important; }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      color: var(--pink);
      text-shadow: 0 0 30px var(--pink), 3px 3px 0px var(--hotpink), 6px 6px 0px rgba(255, 215, 0, 0.5);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 8px;
      animation: crazyBounce 1.5s infinite;
    }
    @keyframes crazyBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      25% { transform: translateY(-15px) rotate(2deg) scale(1.05); }
      50% { transform: translateY(-5px) rotate(-1deg) scale(0.95); }
      75% { transform: translateY(-20px) rotate(3deg) scale(1.08); }
    }
    p { 
      color: #ffb6c1; 
      margin-bottom: 20px; 
      letter-spacing: 2px; 
      max-width: 520px; 
      line-height: 1.8;
      font-size: 1rem;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
    }
    .btn {
      padding: 16px 40px;
      background: transparent;
      color: var(--pink);
      border: 3px solid var(--pink);
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 4px;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.4), inset 0 0 20px rgba(255, 105, 180, 0.2);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 50px;
      animation: buttonPulse 2s infinite;
      margin: 8px;
    }
    @keyframes buttonPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .btn:hover { background: var(--pink); color: #1a0a10; transform: scale(1.15); }
    .achievement-toast {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 215, 0, 0.95);
      color: #1a0a10;
      padding: 15px 25px;
      border-radius: 25px;
      font-weight: bold;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    }
    .achievement-toast.show {
      opacity: 1;
      animation: toastBounce 0.5s;
    }
    @keyframes toastBounce {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.2); }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="leafOverlay"></div>
  
  <div id="ui-layer">
    <div class="hud-top">
      <div id="floor-display">🌸 Dark Spring Sector 01</div>
      <div id="targets-display" style="color:var(--blood-red); font-size: 14px;">💀 Demons: <span id="grumpyCount">3</span></div>
      <div id="alert-display" class="status-alert">KITTY SPOTTED!</div>
    </div>
    <div class="hud-bottom">
      <div class="powerup-display">
        <span class="powerup-icon" id="powerupIcon">✨</span>
        <span id="powerupName">No Powerup</span>
      </div>
      <div class="stars-display" id="starsDisplay">⭐ 0</div>
      <div style="color: #ffb6c1; font-size: 12px;">Score: <span id="scoreDisplay">0</span></div>
    </div>
  </div>

  <div class="achievement-toast" id="achievementToast"></div>

  <div id="start-screen" class="screen">
    <h1>HELLO KITTY</h1>
    <p>🔪✨ Dark Spring Adventure! 🌸<br>Slay the demons, collect stars, and spread BLOOD! 💀</p>
    <button class="btn" id="btn-start">🔪 Start Slaughter 🔪</button>
  </div>

  <div id="game-over-screen" class="screen hidden">
    <h1 style="color: var(--hotpink);">Oh No! 💔</h1>
    <p id="death-reason">The demons caught Hello Kitty!</p>
    <button class="btn" style="border-color: var(--hotpink); color: var(--hotpink);" id="btn-restart">🌈 Try Again!</button>
  </div>

  <div id="victory-screen" class="screen hidden">
    <h1 style="color: var(--spring-green);">Victory! 🎉</h1>
    <p>You slaughtered all demons! Collected <span id="finalStars">0</span> stars and scored <span id="finalScore">0</span> points!</p>
    <button class="btn" id="btn-next">🌟 Next Garden 🌟</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
  function initLeafOverlay() {
    const overlay = document.getElementById('leafOverlay');
    for (let i = 0; i < 30; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'falling-leaf';
      leaf.style.left = Math.random() * 100 + '%';
      leaf.style.animationDuration = (Math.random() * 5 + 5) + 's';
      leaf.style.animationDelay = Math.random() * 5 + 's';
      leaf.style.transform = `rotate(${Math.random() * 360}deg)`;
      overlay.appendChild(leaf);
    }
  }
  initLeafOverlay();

  class SoundFX {
    constructor() { 
      this.ctx = null; 
      this.musicNotes = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 493.88, 523.25, 587.33, 659.25, 783.99];
      this.noteIndex = 0;
      this.musicInterval = null;
    }
    
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.startMusic();
      }
    }
    
    startMusic() {
      const playNextNote = () => {
        if (GAME.state !== 'KILLED') {
          const note = this.musicNotes[this.noteIndex % this.musicNotes.length];
          this.playNote(note, 0.3, 'sine', 0.05);
          this.noteIndex++;
          
          if (this.noteIndex % 4 === 0) {
            this.playNote(note * 1.5, 0.3, 'triangle', 0.03);
          }
        }
        this.musicInterval = setTimeout(playNextNote, 280);
      };
      playNextNote();
    }
    
    playNote(freq, duration, type = 'sine', volume = 0.1) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + duration);
    }
    
    boing() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);
      osc.frequency.exponentialRampToValueAtTime(400, t + 0.3);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.35);
    }
    
    slash() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      // Metal slashing sound
      const bufferSize = this.ctx.sampleRate * 0.15;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(4000, t);
      filter.Q.setValueAtTime(1.5, t);
      
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      
      noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      noise.start(t);
    }
    
    blood() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      // Blood splatter sound
      const bufferSize = this.ctx.sampleRate * 0.3;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(800, t);
      
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      
      noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      noise.start(t);
    }
    
    collect() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [1318.5, 1760].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, t + i * 0.03);
        gain.gain.setValueAtTime(0.15, t + i * 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.03 + 0.2);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t + i * 0.03);
        osc.stop(t + i * 0.03 + 0.2);
      });
    }
    
    alarm() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.setValueAtTime(900, t + 0.15);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.3);
    }
    
    portal() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(523, t);
      osc.frequency.exponentialRampToValueAtTime(1047, t + 0.5);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.5);
    }
    
    impact() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.3);
    }
  }

  const sfx = new SoundFX();

  const GAME = {
    state: 'MENU',
    level: 1,
    timeScale: 1.0,
    keys: { w: false, a: false, s: false, d: false, shift: false },
    score: 0,
    stars: 0,
    powerup: null,
    powerupTime: 0,
    achievements: [],
    screenShake: 0
  };

  const ACHIEVEMENTS = {
    FIRST_BLOOD: "First Blood! 🩸",
    STAR_COLLECTOR: "Star Collector! ⭐",
    SPEED_DEMON: "Speed Demon! 💨",
    UNTOUCHABLE: "Untouchable! 🛡️"
  };

  function showAchievement(name) {
    if (!GAME.achievements.includes(name)) {
      GAME.achievements.push(name);
      const toast = document.getElementById('achievementToast');
      toast.textContent = `🏆 Achievement: ${name}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  }

  class CameraRig {
    constructor(camera) {
      this.camera = camera;
      this.offset = new THREE.Vector3(10, 16, 10);
      this.currentPos = new THREE.Vector3();
      this.trauma = 0;
      this.springOffset = 0;
    }
    addTrauma(amount) {
      this.trauma = Math.min(this.trauma + amount, 1.0);
    }
    update(delta, targetPos) {
      this.springOffset = Math.sin(performance.now() * 0.003) * 0.3;
      
      const desired = targetPos.clone().add(this.offset);
      desired.y += this.springOffset;
      this.currentPos.lerp(desired, 6.0 * delta);

      let sX = 0, sY = 0, sZ = 0, rZ = 0;
      if (this.trauma > 0) {
        const p = this.trauma * this.trauma;
        sX = (Math.random() - 0.5) * 3.5 * p;
        sY = (Math.random() - 0.5) * 3.5 * p;
        sZ = (Math.random() - 0.5) * 3.5 * p;
        rZ = (Math.random() - 0.5) * 0.12 * p;
        this.trauma = Math.max(0, this.trauma - delta * 1.5);
      }

      this.camera.position.set(this.currentPos.x + sX, this.currentPos.y + sY, this.currentPos.z + sZ);
      this.camera.lookAt(targetPos);
      this.camera.rotateZ(rZ);
    }
  }

  class BloodPool {
    constructor(scene, x, z) {
      this.scene = scene;
      const poolGeo = new THREE.CircleGeometry(0.8, 16);
      const poolMat = new THREE.MeshStandardMaterial({ 
        color: 0x8b0000, 
        roughness: 0.2,
        metalness: 0.5,
        transparent: true,
        opacity: 0.8
      });
      this.mesh = new THREE.Mesh(poolGeo, poolMat);
      this.mesh.rotation.x = -Math.PI / 2;
      this.mesh.position.set(x, 0.05, z);
      this.scene.add(this.mesh);
      
      // Blood splatter particles
      this.particles = [];
      for (let i = 0; i < 15; i++) {
        const splatterGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const splatter = new THREE.Mesh(splatterGeo, poolMat);
        splatter.position.set(
          x + (Math.random() - 0.5) * 2,
          0.05,
          z + (Math.random() - 0.5) * 2
        );
        splatter.scale.set(1, 0.1, 1);
        this.scene.add(splatter);
        this.particles.push(splatter);
      }
    }

    fade() {
      this.mesh.material.opacity -= 0.01;
      if (this.mesh.material.opacity <= 0) {
        this.scene.remove(this.mesh);
        this.particles.forEach(p => this.scene.remove(p));
        return true;
      }
      return false;
    }
  }

  class HelloKitty {
    constructor(scene) {
      this.scene = scene;
      this.radius = 0.55;
      this.speed = 13.5;
      this.mesh = new THREE.Group();
      this.walkCycle = 0;
      this.bouncePhase = 0;
      this.isBoinging = false;
      this.isDashing = false;
      this.isShielded = false;
      this.isMagnet = false;
      this.blinkTimer = 0;
      this.isBlinking = false;
      this.bloodPools = [];

      const whiteFur = new THREE.MeshStandardMaterial({ 
        color: 0xffffff, 
        roughness: 0.4, 
        metalness: 0.2 
      });
      const pinkMat = new THREE.MeshStandardMaterial({ 
        color: 0xff69b4, 
        roughness: 0.3, 
        metalness: 0.4 
      });
      const redBowMat = new THREE.MeshStandardMaterial({ 
        color: 0xff0000, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const yellowMat = new THREE.MeshStandardMaterial({ 
        color: 0xffd700, 
        roughness: 0.2, 
        metalness: 0.7,
        emissive: 0xffaa00,
        emissiveIntensity: 0.5
      });
      const bladeMat = new THREE.MeshStandardMaterial({ 
        color: 0xcccccc, 
        roughness: 0.1, 
        metalness: 0.95,
        emissive: 0x444444,
        emissiveIntensity: 0.3
      });

      // BEAUTIFUL BODY
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 64, 64), whiteFur);
      body.position.y = 0.55;
      body.scale.set(0.8, 0.7, 0.5);
      body.castShadow = true;
      this.body = body;
      this.mesh.add(body);

      // PRETTY HEAD
      const head = new THREE.Group();
      head.position.set(0, 1.0, 0);
      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 64), whiteFur);
      skull.castShadow = true;
      head.add(skull);
      this.head = head;
      this.mesh.add(head);

      // BEAUTIFUL EARS
      const earGeo = new THREE.ConeGeometry(0.12, 0.22, 8);
      const leftEar = new THREE.Mesh(earGeo, whiteFur);
      leftEar.position.set(-0.26, 0.26, 0);
      leftEar.rotation.z = 0.15;
      const rightEar = leftEar.clone();
      rightEar.position.x = 0.26;
      rightEar.rotation.z = -0.15;
      head.add(leftEar, rightEar);

      const innerEarGeo = new THREE.ConeGeometry(0.06, 0.14, 8);
      const leftInnerEar = new THREE.Mesh(innerEarGeo, pinkMat);
      leftInnerEar.position.set(-0.26, 0.28, 0);
      leftInnerEar.rotation.z = 0.15;
      const rightInnerEar = leftInnerEar.clone();
      rightInnerEar.position.x = 0.26;
      rightInnerEar.rotation.z = -0.15;
      head.add(leftInnerEar, rightInnerEar);

      // SPARKLING EYES
      this.eyes = [];
      const eyeGeo = new THREE.SphereGeometry(0.07, 32, 32);
      const eyeMat = new THREE.MeshStandardMaterial({ 
        color: 0x000000,
        roughness: 0.1,
        metalness: 0.3,
        emissive: 0x333333,
        emissiveIntensity: 0.5
      });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.14, 0.04, 0.34);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.14;
      head.add(leftEye, rightEye);
      this.eyes.push(leftEye, rightEye);

      // GLOWING NOSE
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 32, 32), yellowMat);
      nose.position.set(0, -0.04, 0.36);
      nose.scale.set(1, 0.7, 0.4);
      head.add(nose);

      // ELEGANT WHISKERS
      const whiskerMat = new THREE.LineBasicMaterial({ color: 0xcccccc, linewidth: 2 });
      for (let side = -1; side <= 1; side += 2) {
        for (let i = -1; i <= 1; i++) {
          const points = [];
          points.push(new THREE.Vector3(side * 0.18, -0.04 + i * 0.08, 0.38));
          points.push(new THREE.Vector3(side * 0.42, -0.04 + i * 0.14, 0.38));
          const whiskerGeo = new THREE.BufferGeometry().setFromPoints(points);
          const whisker = new THREE.Line(whiskerGeo, whiskerMat);
          head.add(whisker);
        }
      }

      // PRETTY BOW
      const bowGeo = new THREE.SphereGeometry(0.1, 32, 32);
      const bowLeft = new THREE.Mesh(bowGeo, redBowMat);
      bowLeft.position.set(-0.32, 0.3, 0);
      bowLeft.scale.set(1.5, 0.8, 0.4);
      const bowRight = bowLeft.clone();
      bowRight.position.x = -0.2;
      bowRight.position.y = 0.26;
      const bowCenter = new THREE.Mesh(new THREE.SphereGeometry(0.06, 32, 32), redBowMat);
      bowCenter.position.set(-0.26, 0.28, 0.08);
      head.add(bowLeft, bowRight, bowCenter);

      // ARMS
      this.arms = [];
      const armGeo = new THREE.SphereGeometry(0.1, 32, 32);
      const leftArm = new THREE.Mesh(armGeo, whiteFur);
      leftArm.position.set(-0.45, 0.55, 0);
      leftArm.scale.set(0.6, 1.0, 0.6);

    activatePowerup(type) {
      GAME.powerup = type;
      GAME.powerupTime = 5;
      this.updatePowerupVisual(type);
    }

    updatePowerupVisual(type) {
      const icon = document.getElementById('powerupIcon');
      const name = document.getElementById('powerupName');
      if (type === 'dash') {
        icon.textContent = '💨';
        name.textContent = 'Dash Boost';
        this.isDashing = true;
      } else if (type === 'shield') {
        icon.textContent = '🛡️';
        name.textContent = 'Shield';
        this.isShielded = true;
        this.shieldMesh.visible = true;
      } else if (type === 'magnet') {
        icon.textContent = '🧲';
        name.textContent = 'Magnet';
        this.isMagnet = true;
      }
    }

    clearPowerup() {
      GAME.powerup = null;
      GAME.powerupTime = 0;
      this.isDashing = false;
      this.isShielded = false;
      this.isMagnet = false;
      this.shieldMesh.visible = false;
      document.getElementById('powerupIcon').textContent = '✨';
      document.getElementById('powerupName').textContent = 'No Powerup';
    }

    update(delta, inputVec, walls, stars, grumpyFriends) {
      if (GAME.state !== 'PLAYING') return;

      if (GAME.powerup) {
        GAME.powerupTime -= delta;
        if (GAME.powerupTime <= 0) {
          this.clearPowerup();
        }
      }

      this.blinkTimer += delta;
      if (this.blinkTimer > 3) {
        this.isBlinking = true;
        if (this.blinkTimer > 3.1) {
          this.isBlinking = false;
          this.blinkTimer = 0;
        }
      }
      this.eyes.forEach(eye => {
        eye.scale.y = this.isBlinking ? 0.1 : 1;
      });

      const isMoving = inputVec.lengthSq() > 0.01;
      const speed = this.isDashing ? this.speed * 2 : this.speed;

      if (isMoving) {
        inputVec.normalize();
        const moveStep = inputVec.clone().multiplyScalar(speed * delta);

        const nextX = this.mesh.position.x + moveStep.x;
        if (!this.checkWallCollision(nextX, this.mesh.position.z, walls)) {
          this.mesh.position.x = nextX;
        }
        const nextZ = this.mesh.position.z + moveStep.z;
        if (!this.checkWallCollision(this.mesh.position.x, nextZ, walls)) {
          this.mesh.position.z = nextZ;
        }

        const targetAngle = Math.atan2(inputVec.x, inputVec.z);
        let diff = targetAngle - this.mesh.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.mesh.rotation.y += diff * 18 * delta;

        this.walkCycle += delta * (this.isDashing ? 28 : 14);
        
        this.legs[0].position.x = -0.18 + Math.sin(this.walkCycle) * 0.1;
        this.legs[1].position.x = 0.18 - Math.sin(this.walkCycle) * 0.1;
        this.legs[0].position.y = 0.12 + Math.abs(Math.sin(this.walkCycle)) * 0.08;
        this.legs[1].position.y = 0.12 + Math.abs(Math.cos(this.walkCycle)) * 0.08;

        this.arms[0].position.x = -0.45 + Math.sin(this.walkCycle) * 0.08;
        this.arms[1].position.x = 0.45 - Math.sin(this.walkCycle) * 0.08;

        this.body.position.y = 0.55 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;
        this.head.position.y = 1.0 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;
        this.dress.position.y = 0.35 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;

        // Knife swing animation
        this.knife.rotation.z = -0.3 + Math.sin(this.walkCycle) * 0.3;
        this.knife.rotation.x = Math.cos(this.walkCycle) * 0.2;

        this.mesh.scale.y = 1 - Math.abs(Math.sin(this.walkCycle * 2)) * 0.04;
        this.mesh.scale.x = 1 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.02;
        this.mesh.scale.z = 1 + Math.abs(Math.sin(this.walkCycle * 2)) * 0.02;
      } else {
        this.legs.forEach(l => l.position.x += (l === this.legs[0] ? -0.18 : 0.18 - l.position.x) * 12 * delta);
        this.legs.forEach(l => l.position.y += (0.12 - l.position.y) * 12 * delta);
        this.body.position.y += (0.55 - this.body.position.y) * 12 * delta;
        this.head.position.y += (1.0 - this.head.position.y) * 12 * delta;
        this.dress.position.y += (0.35 - this.dress.position.y) * 12 * delta;
        
        const idleBounce = Math.sin(performance.now() * 0.003) * 0.02;
        this.mesh.scale.y = 1 + idleBounce;
        this.mesh.scale.x = 1 - idleBounce * 0.3;
        this.mesh.scale.z = 1 - idleBounce * 0.3;
        
        // Idle knife sway
        this.knife.rotation.z = -0.3 + Math.sin(performance.now() * 0.002) * 0.1;
      }

      if (this.isMagnet) {
        stars.forEach(star => {
          if (!star.mesh.userData.collected) {
            const dist = this.mesh.position.distanceTo(star.mesh.position);
            if (dist < 8) {
              const dir = new THREE.Vector3().subVectors(this.mesh.position, star.mesh.position).normalize();
              star.mesh.position.add(dir.multiplyScalar(delta * 15));
            }
          }
        });
      }

      if (Math.random() < 0.001 && !this.isBoinging) {
        this.isBoinging = true;
        this.bouncePhase = 0;
        sfx.boing();
      }

      if (this.isBoinging) {
        this.bouncePhase += delta * 10;
        if (this.bouncePhase > Math.PI) {
          this.isBoinging = false;
          this.mesh.position.y = 0;
        } else {
          this.mesh.position.y = Math.abs(Math.sin(this.bouncePhase)) * 2;
        }
      }

      // Fade blood pools
      this.bloodPools = this.bloodPools.filter(pool => !pool.fade());
    }

    checkWallCollision(x, z, walls) {
      for (const w of walls) {
        const nearestX = Math.max(w.min.x, Math.min(x, w.max.x));
        const nearestZ = Math.max(w.min.z, Math.min(z, w.max.z));
        const dx = x - nearestX;
        const dz = z - nearestZ;
        if ((dx * dx + dz * dz) < (this.radius * this.radius)) return true;
      }
      return false;
    }
  }

  class Demon {
    constructor(scene, x, z, waypoints) {
      this.scene = scene;
      this.speed = 3.8;
      this.waypoints = waypoints;

      this.isSlain = false;
      this.springPhase = Math.random() * Math.PI * 2;

      this.mesh = new THREE.Group();
      this.mesh.position.set(x, 0, z);

      // TERRIFYING BODY
      const body = new THREE.Mesh(

      );

      // GLOWING RED EYES
      const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);

      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.1, 1.35, 0.55);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.1;
      this.mesh.add(leftEye, rightEye);

      // HORNS
      const hornGeo = new THREE.ConeGeometry(0.1, 0.5, 6);
      const hornMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.8 });
      const leftHorn = new THREE.Mesh(hornGeo, hornMat);
      leftHorn.position.set(-0.2, 1.6, 0);
      leftHorn.rotation.z = 0.3;
      const rightHorn = leftHorn.clone();
      rightHorn.position.x = 0.2;
      rightHorn.rotation.z = -0.3;
      this.mesh.add(leftHorn, rightHorn);

      // RED GLOW
      this.demonLight = new THREE.PointLight(0xff0000, 2, 7);
      this.demonLight.position.y = 1.5;
      this.mesh.add(this.demonLight);

      // Vision parameters
      this.maxDist = 9.0;
      this.fov = Math.PI / 3;
      this.rayCount = 36;

      this.coneGeo = new THREE.BufferGeometry();
      this.coneMat = new THREE.MeshBasicMaterial({
        color: 0xff0000,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      this.fovMesh = new THREE.Mesh(this.coneGeo, this.coneMat);
      this.fovMesh.position.y = 0.25;
      this.scene.add(this.fovMesh);

      this.visionSweep = 0;
      this.scene.add(this.mesh);

      this.raycaster = new THREE.Raycaster();
    }

    update(delta, player, wallMeshes) {
      if (this.isSlain || GAME.state !== 'PLAYING') return;

      this.springPhase += delta * 3;
      this.body.position.y = 0.85 + Math.abs(Math.sin(this.springPhase)) * 0.3;
      this.mesh.scale.y = 1 - Math.abs(Math.sin(this.springPhase)) * 0.1;

      if (this.waypoints.length > 0) {
        const target = this.waypoints[this.curWaypoint];
        const dir = new THREE.Vector3().subVectors(target, this.mesh.position);
        dir.y = 0;
        if (dir.length() < 0.4) {
          this.curWaypoint = (this.curWaypoint + 1) % this.waypoints.length;
        } else {
          dir.normalize();
          this.mesh.position.addScaledVector(dir, this.speed * delta);
          const targetAngle = Math.atan2(dir.x, dir.z);
          let diff = targetAngle - this.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          this.mesh.rotation.y += diff * 6 * delta;
        }
      }

      this.visionSweep = Math.sin(performance.now() * 0.0024) * 0.65;
      this.renderDynamicFOV(wallMeshes, player);
    }

    renderDynamicFOV(wallMeshes, player) {
      const baseAngle = this.mesh.rotation.y + this.visionSweep;
      const startAngle = baseAngle - (this.fov / 2);
      const angleStep = this.fov / (this.rayCount - 1);

      const centerOrigin = this.mesh.position.clone().add(new THREE.Vector3(0, 0.4, 0));
      const vertices = [];
      const originX = centerOrigin.x;
      const originZ = centerOrigin.z;

      for (let i = 0; i < this.rayCount; i++) {
        const currentAngle = startAngle + (i * angleStep);
        const dir = new THREE.Vector3(Math.sin(currentAngle), 0, Math.cos(currentAngle)).normalize();

        this.raycaster.set(centerOrigin, dir);
        this.raycaster.near = 0.2;
        this.raycaster.far = this.maxDist;

        const hits = this.raycaster.intersectObjects(wallMeshes, false);
        const castDist = hits.length > 0 ? hits[0].distance : this.maxDist;

        vertices.push(originX + dir.x * castDist, 0.25, originZ + dir.z * castDist);
      }

      const positions = [];
      for (let i = 0; i < this.rayCount - 1; i++) {
        positions.push(originX, 0.25, originZ);
        positions.push(vertices[i * 3], vertices[i * 3 + 1], vertices[i * 3 + 2]);
        positions.push(vertices[(i + 1) * 3], vertices[(i + 1) * 3 + 1], vertices[(i + 1) * 3 + 2]);
      }

      this.coneGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      this.coneGeo.computeVertexNormals();

      const toKitty = new THREE.Vector3().subVectors(player.mesh.position, this.mesh.position);
      toKitty.y = 0;
      const distToKitty = toKitty.length();

      if (distToKitty < this.maxDist + player.radius) {
        toKitty.normalize();
        const fwd = new THREE.Vector3(Math.sin(baseAngle), 0, Math.cos(baseAngle));
        const angle = Math.acos(Math.min(1, Math.max(-1, fwd.dot(toKitty))));

        if (angle < this.fov / 2) {
          const rayOrigin = this.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0));
          const rayDir = player.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0)).sub(rayOrigin).normalize();
          this.raycaster.set(rayOrigin, rayDir);
          this.raycaster.far = distToKitty;

          const occlusions = this.raycaster.intersectObjects(wallMeshes, false);
          if (occlusions.length === 0) {
            if (!player.isShielded) {
              triggerGameOver("The demons caught Hello Kitty!");
            } else {
              showAchievement(ACHIEVEMENTS.UNTOUCHABLE);
            }
          }
        }
      }
    }

    slay() {
      this.isSlain = true;
      this.scene.remove(this.mesh);
      this.scene.remove(this.fovMesh);
    }
  }

  class SparkleField {
    constructor(scene, p1, p2, moveAxis = null, range = 0) {
      this.scene = scene;
      this.p1 = p1;
      this.p2 = p2;
      this.moveAxis = moveAxis;
      this.range = range;
      this.baseP1 = p1.clone();
      this.baseP2 = p2.clone();

      const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
      const mat = new THREE.LineBasicMaterial({ color: 0xff69b4, linewidth: 3 });
      this.line = new THREE.Line(geo, mat);

      const glowMat = new THREE.LineBasicMaterial({ color: 0xffb6c1, transparent: true, opacity: 0.6 });
      this.glow = new THREE.Line(geo, glowMat);
      this.glow.scale.set(1.02, 1.5, 1.02);

      this.group = new THREE.Group();
      this.group.add(this.line);
      this.group.add(this.glow);
      this.scene.add(this.group);
    }

    update(delta, playerPos) {
      const springOffset = Math.sin(performance.now() * 0.003) * this.range;
      if (this.moveAxis === 'x') {
        this.p1.x = this.baseP1.x + springOffset;
        this.p2.x = this.baseP2.x + springOffset;
      } else if (this.moveAxis === 'z') {
        this.p1.z = this.baseP1.z + springOffset;
        this.p2.z = this.baseP2.z + springOffset;
      }
      this.line.geometry.setFromPoints([this.p1, this.p2]);
      this.glow.geometry.setFromPoints([this.p1, this.p2]);

      const dist = this.distToSegment(playerPos, this.p1, this.p2);
      if (dist < 0.65 && !playerPos.isShielded) {
        triggerGameOver("Hello Kitty touched the springy barrier!");
      }
    }

    distToSegment(p, a, b) {
      const l2 = (b.x - a.x) ** 2 + (b.z - a.z) ** 2;
      if (l2 === 0) return Math.hypot(p.x - a.x, p.z - a.z);
      let t = ((p.x - a.x) * (b.x - a.x) + (p.z - a.z) * (b.z - a.z)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.z - (a.z + t * (b.z - a.z)));
    }

    destroy() { this.scene.remove(this.group); }
  }

  class LevelWorld {
    constructor(scene) {
      this.scene = scene;
      this.wallMeshes = [];
      this.wallBoxes = [];
      this.initStaticEnvironment();

    initStaticEnvironment() {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(120, 120),
        new THREE.MeshStandardMaterial({ 
          color: 0x1a3520, 
          roughness: 0.5, 
          metalness: 0.1 
        })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      this.scene.add(floor);

      const grid = new THREE.GridHelper(120, 60, 0x98fb98, 0x3d5a3d);
      grid.position.y = 0.02;
      grid.material.opacity = 0.4;
      grid.material.transparent = true;
      this.scene.add(grid);
    }

    addWall(x, z, w, d) {
      const h = 3.5;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ 
          color: 0x2a3520, 
          roughness: 0.6, 
          metalness: 0.3 
        })
      );
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const wf = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry),
        new THREE.LineBasicMaterial({ color: 0x98fb98, transparent: true, opacity: 0.6 })
      );
      mesh.add(wf);

      this.scene.add(mesh);
      this.wallMeshes.push(mesh);
      this.wallBoxes.push(new THREE.Box2(
        new THREE.Vector2(x - w / 2, z - d / 2),
        new THREE.Vector2(x + w / 2, z + d / 2)
      ));
    }

    buildFacility() {
      this.addWall(0, -26, 50, 2);
      this.addWall(0, 26, 50, 2);
      this.addWall(-26, 0, 2, 50);
      this.addWall(26, 0, 2, 50);

      this.addWall(-10, -10, 14, 2);
      this.addWall(10, -8, 2, 18);
      this.addWall(-8, 10, 2, 16);
      this.addWall(10, 12, 14, 2);
      this.addWall(0, 0, 5, 5);
    }
  }

  function init() {
    const canvas = document.getElementById('gameCanvas');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0a20);
    scene.fog = new THREE.Fog(0x1a0a20, 25, 90);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    rig = new CameraRig(camera);

    const amb = new THREE.AmbientLight(0x556655, 1.4);
    scene.add(amb);

    const dir = new THREE.DirectionalLight(0xd0ffd0, 1.6);
    dir.position.set(-20, 35, 20);
    dir.castShadow = true;
    dir.shadow.mapSize.width = 1024;
    dir.shadow.mapSize.height = 1024;
    scene.add(dir);

    world = new LevelWorld(scene);
    world.buildFacility();

    kitty = new HelloKitty(scene);

    const treePositions = [
      [-38, -35], [-35, 35], [35, -35], [38, 35],
      [-42, 0], [42, 0], [0, -42], [0, 42],
      [-40, -20], [40, -20], [-40, 20], [40, 20],
      [-35, -40], [35, -40], [-35, 40], [35, 40],
      [-20, -45], [20, -45], [-20, 45], [20, 45]
    ];
    
    cherryTrees = treePositions.map(([x, z], index) => new CherryBlossomTree(scene, x, z));

    const portalGeo = new THREE.CylinderGeometry(1.8, 2.0, 0.2, 32);
    const portalMat = new THREE.MeshStandardMaterial({ color: 0x3d5a3d, roughness: 0.3 });
    exitPortal = new THREE.Mesh(portalGeo, portalMat);
    exitPortal.position.set(22, 0.1, 22);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.4, 1.8, 32),
      new THREE.MeshBasicMaterial({ color: 0x98fb98, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.12;
    exitPortal.add(ring);
    scene.add(exitPortal);

    setupLevelData();
    setupInputs();

    requestAnimationFrame(renderLoop);
  }

  function setupLevelData() {
    demons.forEach(g => g.slay());
    demons = [];
    sparkles.forEach(l => l.destroy());
    sparkles = [];
    stars.forEach(s => scene.remove(s.mesh));
    stars = [];
    powerups.forEach(p => scene.remove(p.mesh));
    powerups = [];

    kitty.mesh.position.set(-22, 0, -22);

    demons.push(new Demon(scene, -12, 0, [
      new THREE.Vector3(-12, 0, -8),
      new THREE.Vector3(-12, 0, 8)
    ]));
    demons.push(new Demon(scene, 5, -18, [
      new THREE.Vector3(-4, 0, -18),
      new THREE.Vector3(8, 0, -18)
    ]));
    demons.push(new Demon(scene, 18, 5, [
      new THREE.Vector3(18, 0, -2),
      new THREE.Vector3(18, 0, 18)
    ]));

    sparkles.push(new SparkleField(scene, new THREE.Vector3(-6, 0.5, -2), new THREE.Vector3(6, 0.5, -2), 'z', 6));
    sparkles.push(new SparkleField(scene, new THREE.Vector3(0, 0.5, 6), new THREE.Vector3(0, 0.5, 20), 'x', 5));

    const starPositions = [
      [-15, 1, -15], [0, 1, -10], [15, 1, -5],
      [-5, 1, 5], [5, 1, 15], [-20, 1, 5],
      [10, 1, -20], [-10, 1, 20], [20, 1, -15],
      [-15, 1, 15], [0, 1, 0], [15, 1, 10]
    ];
    starPositions.forEach(([x, y, z]) => stars.push(new Star(scene, x, y, z)));

    powerups.push(new Powerup(scene, -15, 0, 'dash'));
    powerups.push(new Powerup(scene, 15, -10, 'shield'));
    powerups.push(new Powerup(scene, 0, 15, 'magnet'));

    GAME.score = 0;
    GAME.stars = 0;
    updateHUD();
  }

  function updateHUD() {
    document.getElementById('grumpyCount').innerText = demons.filter(g => !g.isSlain).length;
    document.getElementById('floor-display').innerText = `🌸 Dark Spring Sector 0${GAME.level}`;
    document.getElementById('scoreDisplay').innerText = GAME.score;
    document.getElementById('starsDisplay').innerText = `⭐ ${GAME.stars}`;
  }

  function triggerGameOver(reason) {
    if (GAME.state !== 'PLAYING') return;
    GAME.state = 'KILLED';
    sfx.alarm();
    sfx.impact();
    rig.addTrauma(1.0);
    document.getElementById('alert-display').style.opacity = 1;
    document.getElementById('death-reason').innerText = reason;
    setTimeout(() => {
      document.getElementById('game-over-screen').classList.remove('hidden');
    }, 600);
  }

  function checkCollisions() {
    stars.forEach(star => {
      if (!star.mesh.userData.collected && kitty.mesh.position.distanceTo(star.mesh.position) < 1.5) {
        star.mesh.userData.collected = true;
        scene.remove(star.mesh);
        GAME.stars++;
        GAME.score += 100;
        sfx.collect();
        rig.addTrauma(0.3);
        if (GAME.stars >= 5) showAchievement(ACHIEVEMENTS.STAR_COLLECTOR);
        updateHUD();
      }
    });

    powerups.forEach(p => {
      if (kitty.mesh.position.distanceTo(p.mesh.position) < 1.8) {
        kitty.activatePowerup(p.type);
        scene.remove(p.mesh);
        powerups = powerups.filter(pw => pw !== p);
        sfx.collect();
        rig.addTrauma(0.5);
        if (p.type === 'dash') showAchievement(ACHIEVEMENTS.SPEED_DEMON);
      }
    });

    const killDist = 3.0;
    demons.forEach(d => {
      if (!d.isSlain && kitty.mesh.position.distanceTo(d.mesh.position) < killDist) {
        d.slay();
        sfx.slash();
        sfx.blood();
        GAME.score += 500;
        rig.addTrauma(1.0);
        showAchievement(ACHIEVEMENTS.FIRST_BLOOD);
        
        // Create blood pool at kill location
        const bloodPool = new BloodPool(scene, d.mesh.position.x, d.mesh.position.z);
        kitty.bloodPools.push(bloodPool);
        
        updateHUD();
      }
    });

    const remaining = demons.filter(g => !g.isSlain).length;
    if (remaining === 0 && kitty.mesh.position.distanceTo(exitPortal.position) < 2.5) {
      sfx.portal();
      GAME.state = 'CLEAR';
      document.getElementById('finalStars').innerText = GAME.stars;
      document.getElementById('finalScore').innerText = GAME.score;
      document.getElementById('victory-screen').classList.remove('hidden');
    }
  }

  function renderLoop(now) {
    requestAnimationFrame(renderLoop);
    let rawDelta = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    GAME.timeScale += (1.0 - GAME.timeScale) * 5.0 * rawDelta;
    const delta = rawDelta * GAME.timeScale;

    if (GAME.state === 'PLAYING') {
      let moveDir = Input.getVector();
      kitty.update(delta, moveDir, world.wallBoxes, stars, demons);

      demons.forEach(g => g.update(delta, kitty, world.wallMeshes));
      sparkles.forEach(l => l.update(delta, kitty.mesh.position));
      stars.forEach(s => s.update(delta));
      powerups.forEach(p => p.update(delta));
      cherryTrees.forEach((tree, i) => tree.update(delta, i));
      checkCollisions();
    }

    rig.update(rawDelta, kitty.mesh.position);
    renderer.render(scene, camera);
  }

  const Input = {
    getVector() {
      const v = new THREE.Vector3();
      if (GAME.keys.w) v.z -= 1;
      if (GAME.keys.s) v.z += 1;
      if (GAME.keys.a) v.x -= 1;
      if (GAME.keys.d) v.x += 1;
      if (v.lengthSq() > 0) {
        v.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 4);
      }
      return v;
    }
  };

  function setupInputs() {
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (GAME.keys.hasOwnProperty(k)) GAME.keys[k] = true;
      if (k === 'shift') {
        kitty.isDashing = !kitty.isDashing;
        sfx.dash();
        rig.addTrauma(0.4);
      }
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (GAME.keys.hasOwnProperty(k)) GAME.keys[k] = false;
    });

    document.getElementById('btn-start').onclick = () => {
      sfx.init();
      document.getElementById('start-screen').classList.add('hidden');
      GAME.state = 'PLAYING';
      lastTime = performance.now();
    };

    document.getElementById('btn-restart').onclick = () => {
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('alert-display').style.opacity = 0;
      setupLevelData();
      GAME.state = 'PLAYING';
    };

    document.getElementById('btn-next').onclick = () => {
      document.getElementById('victory-screen').classList.add('hidden');
      GAME.level++;
      setupLevelData();
      GAME.state = 'PLAYING';
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  window.onload = init;
  </script>
</body>
</html>
